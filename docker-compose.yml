# Локальная инфраструктура для разработки. Сам API запускается на хосте (pnpm api:dev) ради
# быстрой перезагрузки; в контейнерах живут только сервисы с состоянием.
services:
  postgres:
    # Зафиксирована мажорная версия: минорное обновление безопасно, мажорное требует миграции
    # данных (pg_upgrade).
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: slot_booking
      POSTGRES_PASSWORD: slot_booking # учётные данные только для локальной разработки, больше нигде
      POSTGRES_DB: slot_booking
    ports:
      # Привязка только к localhost, чтобы БД не была видна в локальной сети.
      - '127.0.0.1:5432:5432'
    volumes:
      # Именованный том: данные переживают `docker compose down` (удаляются только через `down -v`).
      # Начиная с образа postgres 18 том монтируется в /var/lib/postgresql (а не .../data).
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slot_booking -d slot_booking']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
